<!DOCTYPE html>
<html lang="en">

<head>

<meta charest="UTF-8">
<meta name="viewport">
<title>User Registration </title>

</head>

<body>

<h1>User Registration</h1>

 <form>

<label for="fullname">Full Name:</label>
<input type="text" id="fullname" name="fullname" required minlength="3">

<br></br>

<label for="email">Email       :</label>
<input type="text" id="email" name="email"required >

<br></br>

<label for="pass">Password:</label>
<input type="text" id="pass" name="pass"required minlength="6" >


<p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
 <br><br>

        <label for="country">Country:</label>
        <select id="country" name="country" required>
            <option value="">Choose a country</option>
            <option value="jordan">Jordan</option>
            <option value="usa">UAE</option>
            <option value="uk">KSA</option>
        </select>

<br><br>

        <label for="message">About You:</label>
        <br>
        <textarea id="message" name="message" required minlength="10"></textarea>

<br><br>

        <input type="checkbox" id="agreement"
               name="agreement" required>
        <label for="agreement">
            I agree to the terms and conditions
        </label>
<br></br>
<button type="submit">Register</button>

 </form>
</body>
</html>
